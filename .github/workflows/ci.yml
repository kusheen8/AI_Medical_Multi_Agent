name: CI - Backend

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  pull_request:
    branches: [main]
    paths: ["backend/**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: backend

    env:
      # Test environment variables (not real credentials)
      GEMINI_API_KEY: "test-ci-key"
      MONGODB_URI: "mongodb://localhost:27017"
      OLLAMA_BASE_URL: "http://localhost:11434"
      OLLAMA_MODEL: "medgemma:4b"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 app --max-line-length=120 --extend-ignore=E203,W503

      - name: Type check with mypy
        run: |
          mypy app --ignore-missing-imports

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit -v --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Check formatting with black
        run: |
          black --check --diff app tests
